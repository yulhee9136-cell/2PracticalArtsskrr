<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>분리배출 마스터</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--green:#3f9d6b;--green-l:#e3f4ea;--blue:#4a8fc9;--blue-l:#e2eff9;--purple:#8a6cc4;--purple-l:#efe9fa;--orange:#f08a3c;--red:#e25b5b;--ink:#2d3a33;--bg:#f6faf4}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Gowun Dodum',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;user-select:none}
h1,h2,h3,button,.jua{font-family:'Jua',sans-serif;font-weight:400}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:#fff;border-bottom:4px solid var(--green-l)}
header h1{font-size:clamp(24px,2.6vw,38px);color:var(--green);cursor:pointer}
.score{font-family:'Jua';font-size:clamp(20px,2vw,30px);background:var(--green-l);padding:6px 20px;border-radius:999px}
main{max-width:1400px;margin:0 auto;padding:24px}
.screen{display:none}.screen.on{display:block}
button{cursor:pointer;border:none;border-radius:20px;transition:transform .1s}
button:active{transform:scale(.96)}
/* 메뉴 */
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;margin-top:10px}
.menu button{padding:34px 18px;font-size:clamp(24px,2.2vw,34px);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.15);line-height:1.3}
.menu button span{display:block;font-size:clamp(50px,5vw,72px);margin-bottom:8px}
.menu button small{display:block;font-family:'Gowun Dodum';font-size:clamp(15px,1.3vw,19px);opacity:.95;margin-top:6px}
.intro{text-align:center;font-size:clamp(20px,1.8vw,28px);margin:6px 0 22px}
.back{background:#fff;border:3px solid #cfdcd3;font-size:20px;padding:8px 20px;margin-bottom:16px}
/* 개념 */
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{font-size:clamp(18px,1.6vw,24px);padding:10px 22px;background:#fff;border:3px solid #cfdcd3}
.tabs button.on{background:var(--green);color:#fff;border-color:var(--green)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{background:#fff;border-radius:22px;padding:22px;border:4px solid var(--green-l);cursor:pointer;min-height:200px;position:relative}
.card .ic{font-size:56px}
.card h3{font-size:clamp(26px,2.2vw,34px);margin:6px 0}
.card .hide{font-size:clamp(18px,1.5vw,23px);line-height:1.55}
.card.closed .hide{filter:blur(9px);opacity:.5}
.card.closed::after{content:'눌러서 확인 👆';position:absolute;right:16px;bottom:12px;font-family:'Jua';color:var(--green);font-size:18px}
.card b{color:var(--orange)}
/* 퀴즈 공통 */
.qbox{background:#fff;border-radius:28px;padding:30px;text-align:center;box-shadow:0 6px 0 #dce8df}
.qnum{font-family:'Jua';color:#8aa596;font-size:22px}
.item{font-size:clamp(90px,10vw,140px);line-height:1.1;margin:10px 0}
.qtext{font-size:clamp(28px,3vw,44px);font-family:'Jua';margin:8px 0 20px;line-height:1.35}
.hint{font-size:clamp(17px,1.5vw,22px);color:#6b7d72;margin-top:-10px;margin-bottom:18px}
.choices{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.choices button{font-size:clamp(20px,1.9vw,28px);padding:20px 10px;background:var(--green-l);color:var(--ink);border:4px solid transparent;line-height:1.3}
.choices button .e{display:block;font-size:clamp(34px,3vw,46px)}
.choices button.ok{background:#c9f0d6;border-color:var(--green)}
.choices button.no{background:#fbdcdc;border-color:var(--red)}
.feedback{min-height:90px;margin-top:20px;font-size:clamp(20px,1.9vw,28px);line-height:1.5;padding:14px;border-radius:18px;display:none}
.feedback.ok{display:block;background:#e7f8ec;color:#226b43}
.feedback.no{display:block;background:#fdeceb;color:#a33c3c}
.next{margin-top:18px;font-size:clamp(22px,2vw,30px);padding:14px 44px;background:var(--orange);color:#fff;display:none;box-shadow:0 5px 0 #c86a25}
.ox{grid-template-columns:1fr 1fr}
.ox button{font-size:clamp(70px,8vw,120px);padding:10px}
/* 순서 */
.slots{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.slot{width:clamp(150px,17vw,230px);min-height:150px;border:4px dashed #b9cfc0;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;background:#fafdfb;padding:8px}
.slot .n{font-family:'Jua';color:#8aa596;font-size:22px}
.slot.fill{border-style:solid;border-color:var(--green);background:var(--green-l)}
.slot .e{font-size:48px}.slot .t{font-family:'Jua';font-size:26px}.slot .d{font-size:16px;text-align:center}
.pool{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.pool button{width:clamp(150px,17vw,230px);padding:16px 8px;background:#fff;border:4px solid #cfdcd3;font-size:26px}
.pool button .e{display:block;font-size:46px}
.pool button:disabled{opacity:.25}
.result{text-align:center;padding:40px}
.result .big{font-size:clamp(80px,9vw,130px)}
.result h2{font-size:clamp(34px,3.5vw,52px);margin:10px 0}
.result p{font-size:clamp(22px,2vw,30px)}
.result button{margin:24px 8px 0;font-size:26px;padding:14px 34px;color:#fff;background:var(--green)}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
.pop{animation:pop .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .3s}
.score{display:flex;gap:10px;background:none;padding:0}
.score .pill{background:var(--green-l);padding:6px 18px;border-radius:999px}
.score .pill.bad{background:#fdeceb;color:#a33c3c}
.home{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start}
@media(max-width:900px){.home{grid-template-columns:1fr}}
.menu button.locked{background:#c9d1cc!important;color:#7d8a82;box-shadow:none;cursor:not-allowed}
.menu button .badge{position:absolute;top:10px;right:14px;font-size:30px}
.menu button{position:relative}
.qrpanel{background:#fff;border-radius:24px;padding:20px;text-align:center;box-shadow:0 6px 0 #dce8df}
.qrpanel h3{font-size:24px;color:var(--green);margin-bottom:10px}
.qrpanel #qr{display:flex;justify-content:center;cursor:pointer}
.qrpanel p{font-size:16px;color:#6b7d72;margin-top:10px}
.reset{margin-top:16px;background:#fff;border:3px solid #e9c7c7;color:#a33c3c;font-size:18px;padding:8px 16px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10}
.modal.on{display:flex}
.modal div{background:#fff;padding:30px;border-radius:28px;text-align:center}
.modal p{font-family:'Jua';font-size:30px;margin-top:14px}
.learnbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;font-family:'Jua';font-size:22px}
.tabs button.done::after{content:' ✅'}
.passbtn{font-size:24px;padding:12px 30px;background:var(--orange);color:#fff;box-shadow:0 5px 0 #c86a25}
.passbtn:disabled{background:#c9d1cc;box-shadow:none;cursor:not-allowed}
.score{display:flex;gap:8px;align-items:center;background:none;padding:0;flex-wrap:wrap;justify-content:flex-end}
.score .pill{background:var(--green-l);padding:6px 16px;border-radius:999px}
.score .pill.bad{background:#fdeceb;color:#a33c3c}
.score .pill.who{background:#fff4e6;color:#c4661f}
.logout{background:#fff;border:3px solid #cfdcd3;font-size:18px;padding:6px 14px}
.home{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start}
@media(max-width:900px){.home{grid-template-columns:1fr}}
.menu button.locked{background:#c9d1cc!important;color:#7d8a82;box-shadow:none;cursor:not-allowed}
.menu button{position:relative}
.menu button .badge{position:absolute;top:10px;right:14px;font-size:30px}
.qrpanel{background:#fff;border-radius:24px;padding:20px;text-align:center;box-shadow:0 6px 0 #dce8df}
.qrpanel h3{font-size:24px;color:var(--green);margin-bottom:10px}
.qrpanel #qr{display:flex;justify-content:center;cursor:pointer}
.qrpanel p{font-size:16px;color:#6b7d72;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10}
.modal.on{display:flex}
.modal>div{background:#fff;padding:30px;border-radius:28px;text-align:center}
.modal p{font-family:'Jua';font-size:30px;margin-top:14px}
.learnbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;font-family:'Jua';font-size:22px}
.tabs button.done::after{content:' ✅'}
.passbtn{font-size:24px;padding:12px 30px;background:var(--orange);color:#fff;box-shadow:0 5px 0 #c86a25}
.passbtn:disabled{background:#c9d1cc;box-shadow:none;cursor:not-allowed}
.codeview{display:flex;gap:12px;justify-content:center;margin:6px 0 18px}
.codeview span{width:70px;height:86px;border-radius:18px;border:4px solid #b9cfc0;font-family:'Jua';font-size:52px;display:flex;align-items:center;justify-content:center;background:#fafdfb}
.codeview span.f{border-color:var(--green);background:var(--green-l)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:420px;margin:0 auto}
.pad button{font-size:38px;padding:14px 0;background:var(--green-l);color:var(--ink);box-shadow:0 4px 0 #c2dccb}
.pad button.ok{background:var(--green);color:#fff}
.pad button.del{background:#fdeceb}
.rstats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.rstats div{background:var(--green-l);border-radius:18px;padding:12px 20px;font-size:22px;min-width:150px}
.rstats b{display:block;font-family:'Jua';font-weight:400;font-size:34px}
.saved{font-size:17px;color:#6b7d72;min-height:24px}
.hist{margin:14px auto 0;border-collapse:collapse;font-size:19px;min-width:min(560px,100%)}
.hist th{background:#f2f6f3;font-family:'Jua';font-weight:400;padding:6px 12px}
.hist td{border-bottom:2px dotted #dce8df;padding:6px 12px}
.hist tr.now td{background:#fff4e6;font-weight:bold}
.warn{margin-top:18px;text-align:center;color:#a33c3c;font-size:17px}
.timer{color:#6b7d72}
.runbar{margin-top:18px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-family:'Jua';font-size:22px;background:#fff;border-radius:18px;padding:12px}
.runbar button{background:#fff;border:3px solid #cfdcd3;font-size:19px;padding:6px 14px}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<header>
  <h1 onclick="go('menu')">♻️ 분리배출 마스터</h1>
  <div class="score" id="scoreBox">
    <span class="pill">⭕ 맞힘 <span id="okc">0</span></span>
    <span class="pill bad">❌ 틀림 <span id="noc">0</span></span>
  </div>
</header>
<main>

<!-- 메뉴 -->
<section id="menu" class="screen on">
  <p class="intro">환경을 고려하며 생활 자원을 관리해 보아요 (실과 92~93쪽)</p>
  <div class="home">
    <div>
      <div class="menu" id="menuGrid"></div>
      <div class="runbar" id="runbar"></div>
    </div>
    <div class="qrpanel">
      <h3>📱 QR로 들어오기</h3>
      <div id="qr" onclick="openQR()"></div>
      <p>누르면 크게 보여요</p>
    </div>
  </div>
</section>

<!-- 개념 카드 -->
<section id="learn" class="screen">
  <button class="back" onclick="go('menu')">◀ 처음으로</button>
  <div class="learnbar"><span id="learnProg"></span><span class="timer">⏱️ <span class="tm"></span></span><button class="passbtn" id="learnPass" onclick="finishStage()">다 봤어요! ▶</button></div>
  <div class="tabs" id="tabs"></div>
  <div class="cards" id="cards"></div>
</section>

<!-- 퀴즈 -->
<section id="quiz" class="screen">
  <button class="back" onclick="go('menu')">◀ 처음으로</button>
  <div class="qbox">
    <div class="qnum"><span id="qnum"></span> · ⏱️ <span class="tm"></span></div>
    <div class="item" id="qitem"></div>
    <div class="qtext" id="qtext"></div>
    <div class="hint" id="qhint"></div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="fb"></div>
    <button class="next" id="next" onclick="nextQ()">다음 ▶</button>
  </div>
</section>

<!-- 순서 -->
<section id="order" class="screen">
  <button class="back" onclick="go('menu')">◀ 처음으로</button>
  <div class="qbox">
    <div class="qnum">⏱️ <span class="tm"></span></div>
    <div class="qtext">분리배출 기본 규칙! 순서대로 눌러 보세요</div>
    <div class="slots" id="slots"></div>
    <div class="pool" id="pool"></div>
    <div class="feedback" id="ofb"></div>
  </div>
</section>

<!-- 전체 결과 -->
<section id="final" class="screen">
  <div class="qbox result">
    <div class="big">🏆</div>
    <h2>분리배출 마스터! <span id="fnum"></span></h2>
    <div class="rstats" id="fstats"></div>
    <table class="hist" id="fstage"></table>
    <h3 class="jua" style="font-size:26px;margin-top:22px">📋 나의 도전 기록</h3>
    <table class="hist" id="fruns"></table>
    <button style="background:var(--orange)" onclick="newRun();openStage(0)">1단계부터 다시 도전 🔄</button>
    <button style="background:var(--blue)" onclick="go('menu')">처음으로 🏠</button>
  </div>
</section>

<!-- 결과 -->
<section id="result" class="screen">
  <div class="qbox result">
    <div class="big" id="rbig"></div>
    <h2 id="rtitle"></h2>
    <div class="rstats" id="rstats"></div>
    <div class="saved" id="rsaved"></div>
    <table class="hist" id="rhist"></table>
    <button id="rnext" style="background:var(--orange)" onclick="openStage(curStage+1)">다음 단계로 ▶</button>
    <button onclick="openStage(curStage)">다시 하기 🔄</button>
    <button style="background:var(--blue)" onclick="go('menu')">처음으로 🏠</button>
  </div>
</section>

</main>
<div class="modal" id="modal" onclick="this.classList.remove('on')"><div><div id="qrBig"></div><p>휴대폰 카메라로 찍어 보세요</p></div></div>

<script>
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const $=id=>document.getElementById(id);
const fmt=s=>`${Math.floor(s/60)}분 ${s%60}초`;
const KEY='eco-master-v2';

/* 기록: 이 기기에만 저장 */
let S={run:null,runs:[]};      // run={n,stages:{i:{secs,ok,no,tries}},ok,no}
try{const v=JSON.parse(localStorage.getItem(KEY));if(v)S=v}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function newRun(){S.run={n:S.runs.length+1,stages:{},ok:0,no:0};save();renderCount()}
let runOk=0,runNo=0,t0=0,tick=null;
if(!S.run)newRun();

/* ---------- 화면 / 카운트 / 타이머 ---------- */
function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
  window.scrollTo(0,0);
  if(id==='menu'){stopTimer();runOk=0;runNo=0;renderCount();renderMenu()}
}
function renderCount(){$('okc').textContent=S.run.ok+runOk;$('noc').textContent=S.run.no+runNo}
function bump(id){const el=$(id).parentElement;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}
function count(good){good?runOk++:runNo++;renderCount();bump(good?'okc':'noc')}
function startTimer(){runOk=0;runNo=0;t0=Date.now();clearInterval(tick);showTime();tick=setInterval(showTime,1000)}
function stopTimer(){clearInterval(tick);tick=null}
function elapsed(){return Math.round((Date.now()-t0)/1000)}
function showTime(){document.querySelectorAll('.tm').forEach(e=>e.textContent=fmt(elapsed()))}

/* ---------- 단계 ---------- */
const STAGES=[
 {e:'📖',t:'개념 카드',d:'카드를 모두 열어 봐요',c:'var(--green)'},
 {e:'💡',t:'절약·재사용·재활용',d:'어떤 방법일까요?',c:'var(--blue)'},
 {e:'🔢',t:'기본 규칙 순서',d:'4단계를 순서대로!',c:'var(--purple)'},
 {e:'🗑️',t:'어디에 버릴까?',d:'분리배출 게임',c:'var(--orange)'},
 {e:'⭕',t:'OX 퀴즈',d:'맞을까, 틀릴까?',c:'#d86b8f'}];
let curStage=0;
const done=i=>!!S.run.stages[i];
const unlocked=i=>i===0||done(i-1);
const runTotal=r=>Object.values(r.stages).reduce((a,s)=>a+s.secs,0);
function renderMenu(){
  $('menuGrid').innerHTML=STAGES.map((g,i)=>{
    const locked=!unlocked(i),st=S.run.stages[i];
    return `<button class="${locked?'locked':''}" style="background:${g.c}" onclick="openStage(${i})">${st?'<span class="badge">✅</span>':locked?'<span class="badge">🔒</span>':''}<span>${g.e}</span>${i+1}단계 · ${g.t}<small>${locked?'앞 단계를 통과하면 열려요':st?`통과! ⏱️ ${fmt(st.secs)}`:g.d}</small></button>`}).join('');
  const n=Object.keys(S.run.stages).length;
  $('runbar').innerHTML=`<span>🏃 ${S.run.n}차 도전 · ${n}/${STAGES.length}단계 · 지금까지 ⏱️ ${fmt(runTotal(S.run))}</span>`+
    (S.runs.length?`<button onclick="showFinal()">📋 나의 기록</button>`:'')+
    (n?`<button onclick="newRun();renderMenu()">🔄 1단계부터 다시</button>`:'');
}
function openStage(i){
  if(i>=STAGES.length||!unlocked(i))return;
  curStage=i;startTimer();
  if(i===0){seen={};go('learn');renderLearn()}
  else if(i===2){go('order');startOrder()}
  else{go('quiz');startQuiz(['','way','','sort','ox'][i])}
}
function finishStage(){
  stopTimer();
  const prev=S.run.stages[curStage];
  const rec={secs:elapsed(),ok:runOk,no:runNo,tries:(prev?prev.tries:0)+1};
  S.run.stages[curStage]=rec;S.run.ok+=runOk;S.run.no+=runNo;runOk=0;runNo=0;
  const last=curStage===STAGES.length-1;
  if(last){
    const total=runTotal(S.run);
    S.runs.push({n:S.run.n,total,ok:S.run.ok,no:S.run.no,stages:STAGES.map((g,i)=>S.run.stages[i].secs),date:new Date().toLocaleDateString('ko-KR')});
    S.lastRun=S.run;save();renderCount();showFinal(true);
    S.run={n:S.runs.length+1,stages:{},ok:0,no:0};save();
    return;
  }
  save();renderCount();showResult(rec);
}
function showResult(rec){
  const tot=rec.ok+rec.no,rate=tot?Math.round(rec.ok/tot*100):null;
  $('rbig').textContent=rate===100?'🌟':'🎉';
  $('rtitle').textContent=`${curStage+1}단계 통과!`;
  $('rstats').innerHTML=`<div>⏱️ 걸린 시간<b>${fmt(rec.secs)}</b></div>`+
    (tot?`<div>⭕ 맞힘<b>${rec.ok}</b></div><div>❌ 틀림<b>${rec.no}</b></div><div>🎯 정답률<b>${rate}%</b></div>`:'');
  $('rsaved').textContent='';$('rhist').innerHTML='';
  $('rnext').style.display='inline-block';$('rnext').textContent=`${curStage+2}단계로 ▶`;
  go('result');
}
function showFinal(justDone){
  const r=S.runs[S.runs.length-1];if(!r)return;
  const tot=r.ok+r.no;
  $('fnum').textContent=`(${r.n}차 도전)`;
  $('fstats').innerHTML=`<div>⏱️ 전체 시간<b>${fmt(r.total)}</b></div><div>⭕ 맞힘<b>${r.ok}</b></div><div>❌ 틀림<b>${r.no}</b></div><div>🎯 정답률<b>${tot?Math.round(r.ok/tot*100):0}%</b></div>`;
  $('fstage').innerHTML='<tr>'+STAGES.map((g,i)=>`<th>${i+1}단계</th>`).join('')+'</tr><tr>'+r.stages.map(s=>`<td>${fmt(s)}</td>`).join('')+'</tr>';
  const best=Math.min(...S.runs.map(x=>x.total));
  $('fruns').innerHTML='<tr><th>도전</th><th>날짜</th><th>전체 시간</th><th>맞힘</th><th>틀림</th><th>정답률</th></tr>'+
    S.runs.map(x=>{const t=x.ok+x.no;return `<tr class="${x===r?'now':''}"><td>${x.n}차${x.total===best?' 🥇':''}</td><td>${x.date}</td><td>${fmt(x.total)}</td><td>${x.ok}</td><td>${x.no}</td><td>${t?Math.round(x.ok/t*100):0}%</td></tr>`}).join('');
  go('final');
}

let mode,qs,qi,answered;
function startQuiz(m){
  mode=m;qi=0;
  qs=m==='sort'?shuffle(SORT).slice(0,10):m==='way'?shuffle(WAY):shuffle(OX).slice(0,8);
  showQ();
}
function showQ(){
  answered=false;const q=qs[qi];
  $('qnum').textContent=`${qi+1} / ${qs.length}`;
  const it=$('qitem');it.textContent=q.i;it.classList.remove('pop');void it.offsetWidth;it.classList.add('pop');
  $('fb').className='feedback';$('fb').innerHTML='';$('next').style.display='none';
  const ch=$('choices');ch.className='choices';
  if(mode==='ox'){
    $('qtext').textContent=q.n;$('qhint').textContent='';ch.classList.add('ox');
    ch.innerHTML=['O','X'].map(o=>`<button data-k="${o}" onclick="pick(this)">${o==='O'?'⭕':'❌'}</button>`).join('');return;
  }
  const opts=mode==='sort'?BINS:WAYS;
  $('qtext').textContent=mode==='sort'?`'${q.n}'은(는) 어디에 버릴까요?`:q.n;
  $('qhint').textContent=mode==='sort'?'':'어떤 생활 자원 관리 방법일까요?';
  ch.innerHTML=Object.entries(opts).map(([k,v])=>`<button data-k="${k}" onclick="pick(this)"><span class="e">${v.e}</span>${v.t}</button>`).join('');
}
function pick(btn){
  if(answered)return;const q=qs[qi],fb=$('fb');
  if(btn.dataset.k===q.a){
    answered=true;count(true);btn.classList.add('ok','pop');
    fb.className='feedback ok';fb.innerHTML='🎉 정답! '+q.x;
    $('next').style.display='inline-block';
    $('next').textContent=qi+1<qs.length?'다음 ▶':'결과 보기 ▶';
  }else{
    count(false);btn.classList.add('no','shake');btn.disabled=true;
    fb.className='feedback no';fb.innerHTML='🤔 다시 생각해 볼까요? 한 번 더!';
  }
}
function nextQ(){qi++;if(qi<qs.length)showQ();else finishStage()}

const STEPS=[{e:'💧',t:'버리기',d:'내용물 비우기'},{e:'🚰',t:'헹구기',d:'물로 헹구기'},{e:'🏷️',t:'제거하기',d:'상표·뚜껑 떼기'},{e:'🗂️',t:'구분하기',d:'종류별로 나누기'}];
let ostep;
function startOrder(){
  ostep=0;
  $('slots').innerHTML=STEPS.map((s,i)=>`<div class="slot" id="slot${i}"><span class="n">${i+1}단계</span></div>`).join('');
  let order;do{order=shuffle([0,1,2,3])}while(order.join()==='0,1,2,3');
  $('pool').innerHTML=order.map(i=>`<button data-i="${i}" onclick="pickStep(this)"><span class="e">${STEPS[i].e}</span>${STEPS[i].t}</button>`).join('');
  $('ofb').className='feedback';
}
function pickStep(btn){
  const i=+btn.dataset.i,fb=$('ofb');
  if(i===ostep){
    count(true);const s=STEPS[i],sl=$('slot'+i);
    sl.className='slot fill pop';sl.innerHTML=`<span class="n">${i+1}단계</span><span class="e">${s.e}</span><span class="t">${s.t}</span><span class="d">${s.d}</span>`;
    btn.disabled=true;ostep++;fb.className='feedback';
    if(ostep===4){fb.className='feedback ok';fb.innerHTML='🎉 완벽해요!';setTimeout(finishStage,900)}
  }else{
    count(false);btn.classList.remove('shake');void btn.offsetWidth;btn.classList.add('shake');
    fb.className='feedback no';fb.innerHTML=`🤔 ${ostep+1}단계가 아니에요. 다시 골라 볼까요?`;
  }
}
